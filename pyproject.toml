[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ra-product-monitor"
version = "0.1.0"
description = "Monitoramento de reclamações do Reclame Aqui associadas a produtos de interesse em vigilância sanitária."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Coleta (Playwright) entra em uso na fase de coletor; não é necessária para subir a API.
collect = ["playwright>=1.47"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.routers"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
